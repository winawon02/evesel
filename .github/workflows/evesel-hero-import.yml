name: EVESEL hero asset finalization (one-time)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/evesel-hero-import.yml'
permissions:
  contents: write
jobs:
  import-hero:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Assemble and verify EVESEL video assets
        shell: bash
        run: |
          set -euo pipefail
          cat .staging/evesel-hero/part-*.b64 | base64 --decode > assets/hero-loop.mp4
          echo "fa05ab7767784bfa19dd4b50feedda5c5d699767b29f788ce28f2da5cf79f521  assets/hero-loop.mp4" | sha256sum --check
          cp .staging/evesel-hero/hero-poster.webp assets/hero-poster.webp
          echo "e26a46553f56c6a0a4984dc5fa8035cf40ba8083f244a537f3a6f1b099be8322  assets/hero-poster.webp" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          substitutions = {
            './assets/hero-loop.mp4?v=20261112-bluehands': './assets/hero-loop.mp4?v=20261113-beaker-balanced',
            'poster="./assets/hero-poster.webp"': 'poster="./assets/hero-poster.webp?v=20261113-beaker-balanced"',
            'content="./assets/hero-poster.webp"': 'content="./assets/hero-poster.webp?v=20261113-beaker-balanced"',
          }
          for old, new in substitutions.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Unexpected index markup for {old!r}: found {text.count(old)} occurrences')
              text = text.replace(old, new)
          p.write_text(text, encoding='utf-8')
          PY
          git rm -r .staging/evesel-hero
          git rm .github/workflows/evesel-hero-import.yml
          git add assets/hero-loop.mp4 assets/hero-poster.webp index.html
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: replace EVESEL hero with balanced beaker production video and poster"
          git push origin HEAD:main
